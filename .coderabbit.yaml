# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# CodeRabbit reviews every pull request before a committer does. It asks the
# author for changes, and approves once its comments are resolved and no check
# below is failing. Its approval alone can't merge anything: CODEOWNERS makes
# every pull request need a committer's approval too. The rules come from
# CONTRIBUTING.md and MAINTAINING.md. A change to this file needs the code
# owner's review.

language: en-US
tone_instructions: "Plain and direct. Say what to change and why, in a sentence or two. No praise, no emoji."

reviews:
  profile: chill
  request_changes_workflow: true
  # Authors can't approve their own pull request with `@coderabbitai approve`.
  allow_author_approval: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  sequence_diagrams: false
  # Only pull requests to the default branch, main, are reviewed.
  auto_review:
    enabled: true
    drafts: false

  auto_apply_labels: true
  labeling_instructions:
    - label: "risk: low"
      instructions: >-
        Apply when every changed file is documentation or similar: the docs site
        under www/, Markdown files anywhere, examples/, or changes to comments
        only. Apply exactly one risk label, the highest that any changed file
        calls for.
    - label: "risk: medium"
      instructions: >-
        Apply when the highest-risk change is to a component or a test: files
        under platform/src/components/ (except component.ts), tests anywhere
        (platform/test/, *_test.go, *.test.ts), or the SDKs' source under sdk/
        (except the sdk/js files listed for high). Apply exactly one risk
        label, the highest that any changed file calls for.
    - label: "risk: high"
      instructions: >-
        Apply when any changed file is: Go code in cmd/, pkg/ or internal/
        (other than tests); shared platform code every app runs, meaning
        platform/src/ outside platform/src/components/, and
        platform/src/components/component.ts; platform/functions/ or
        platform/support/ (code that runs in AWS or in `sst dev`); release and
        install files (.goreleaser.yml, install, platform/scripts/,
        sdk/js/package.json, sdk/js/scripts/, sdk/js/bin/,
        pkg/global/distribution.go); dependencies (go.mod, go.sum, any
        package.json, bun.lockb); anything under .github/; or .coderabbit.yaml.
  mutually_exclusive_groups:
    risk:
      - "risk: low"
      - "risk: medium"
      - "risk: high"

  path_instructions:
    - path: "platform/src/components/**"
      instructions: >-
        The doc comments here generate the component reference pages on the
        docs site. When an arg, a default or a behavior changes, its doc comment
        (including @default and examples) must change with it. Components
        create real resources in users' accounts: flag anything that would
        replace or delete an existing resource on update, such as a changed
        resource name, a changed Pulumi type, or a removed alias, and ask how it
        was tested. Files the fork added import relative paths without `.js`;
        files that came from SST keep their `.js`. Follow the style of the file
        being changed.
    - path: "platform/src/{auto,shim,runtime,util,ast}/**"
      instructions: >-
        Every app runs this code, on every deploy. Ask for a test or a
        description of what was run, and flag any change in behavior for
        existing apps.
    - path: "{cmd,pkg,internal}/**/*.go"
      instructions: >-
        The Go CLI. When behavior changes, ask for a test; `go test ./...` runs
        in CI. Flag changes to state handling, to what `sst dev` does, and to
        anything that deletes resources. Flag new telemetry or network calls.
    - path: "platform/functions/**"
      instructions: >-
        The bridge and the runtimes that run inside users' AWS accounts and in
        `sst dev`. Flag anything that changes what's sent over the network or
        what permissions it needs.
    - path: ".github/**"
      instructions: >-
        Workflows and repo automation. Check: `permissions` blocks are as narrow
        as the job needs; no `pull_request_target` that checks out or runs the
        pull request's code; secrets aren't exposed to code from a pull request;
        third-party actions come from a known publisher; the release job keeps
        `environment: release`. These files need the code owner's review.
    - path: "www/src/content/docs/**"
      instructions: >-
        Hand-written docs pages. Check that links work with the site's /sst
        base, that commands install the fork (`@sst-community/sst`, or `sst`
        aliased to it) rather than SST's `sst` package, and that SST's own
        services aren't presented as this project's.

  pre_merge_checks:
    # A failing check can only be waived by a requested reviewer or a member,
    # never by the pull request's author.
    override_requested_reviewers_only: true
    title:
      mode: error
      requirements: >-
        The title is the area, a colon, then what the change does, in the
        imperative, for example `Function: retain the shared dev bridge code
        object on delete` or `Docs: fix the Astro start guide`. No
        conventional-commit prefix (`feat:`, `fix(scope):`), no trailing
        period, no issue or pull request number.
    description:
      mode: warning
    docstrings:
      mode: off
    issue_assessment:
      mode: warning
    custom_checks:
      - name: "No edits to generated docs"
        mode: error
        instructions: >-
          Fail if the pull request adds or changes files under
          www/src/content/docs/docs/component/ or
          www/src/content/docs/docs/reference/, except
          www/src/content/docs/docs/reference/sdk.mdx, which is written by
          hand. Those pages are generated from the doc comments in platform/src
          and cmd/sst, so the change belongs in the comment. Pass otherwise.
      - name: "No version changes"
        mode: error
        instructions: >-
          Fail if the pull request changes a "version" field in any
          package.json, a version constant in Go code, or a version in
          pyproject.toml or Cargo.toml of a package this repo publishes.
          Maintainers set versions when they release. Dependency version
          changes are not version changes for this check, and adding release
          notes under .github/release-notes/ is fine. Pass otherwise.
      - name: "Says how it was tested"
        mode: error
        instructions: >-
          If the pull request changes Go code in cmd/, pkg/ or internal/, or
          files under platform/src/ or platform/functions/, other than comments
          and tests, fail unless the description says what was run to check
          it: for example an example app deployed, `sst dev` run, or the tests
          added. Pass if every change is to docs, comments, tests, examples/ or
          Markdown.
      - name: "One change"
        mode: warning
        instructions: >-
          Warn if the pull request mixes unrelated changes, such as a fix and a
          refactor, or two separate fixes, that would be clearer as separate
          pull requests. Pass if all the changes serve one purpose.
      - name: "Code owner files"
        mode: warning
        instructions: >-
          Warn if the pull request changes any of: anything under .github/,
          .goreleaser.yml, platform/scripts/build, sdk/js/package.json,
          anything under sdk/js/scripts/ or sdk/js/bin/, install,
          pkg/global/distribution.go, or .coderabbit.yaml. Say that the code
          owner must review it before it can merge. Pass otherwise.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CONTRIBUTING.md"
      - "MAINTAINING.md"
      - "**/CLAUDE.md"
