[project]
name = "custom_dockerfile"
version = "0.1.0"
description = "Custom Dockerfile"
dependencies = ["core", "sst-sdk"]
requires-python = "==3.11.*"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
core = { workspace = true }
sst-sdk = { git = "https://github.com/sst-community/sst.git", branch = "main", subdirectory = "sdk/python" }
